<!doctype html>
<html lang="fr" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a1c3d" />

    <title>HVAC, désenfumage et protection incendie en Algérie | HIS — HVAC and Industrial Solution</title>
    <meta
      name="description"
      content="HIS conçoit, installe et entretient vos systèmes de climatisation, ventilation, désenfumage et protection incendie. Bureau d'études et équipes qualifiées basés à Blida. Devis gratuit."
    />
    <meta name="author" content="HIS — HVAC and Industrial Solution" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />

    <!--
      ── Aperçu de lien (Open Graph / Twitter) ────────────────────────────────
      CES BALISES DOIVENT RESTER DANS LE HTML STATIQUE. Les robots des réseaux
      sociaux (Telegram, WhatsApp, Facebook, LinkedIn, X…) n'exécutent PAS le
      JavaScript : ils ne voient jamais les balises injectées par React
      (src/components/Seo.tsx). Sans celles-ci dans index.html, un lien partagé
      s'affiche sans image ni description. Les valeurs correspondent à la page
      d'accueil (français) — la version montrée par défaut au partage.
      Les URL doivent être ABSOLUES. ⚠️ Si le domaine change, mettre à jour ces
      URL ET `siteUrl` dans src/content/company.ts (ou la variable
      VITE_SITE_URL sur Vercel, qui a la priorité).
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HIS — HVAC and Industrial Solution" />
    <meta
      property="og:title"
      content="HVAC, désenfumage et protection incendie en Algérie | HIS — HVAC and Industrial Solution"
    />
    <meta
      property="og:description"
      content="HIS conçoit, installe et entretient vos systèmes de climatisation, ventilation, désenfumage et protection incendie. Bureau d'études et équipes qualifiées basés à Blida. Devis gratuit."
    />
    <meta property="og:url" content="https://www.his-hvac.com/" />
    <meta property="og:image" content="https://www.his-hvac.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="HIS — HVAC and Industrial Solution, Blida, Algérie" />
    <meta property="og:locale" content="fr_DZ" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:locale:alternate" content="ar_DZ" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="HVAC, désenfumage et protection incendie en Algérie | HIS — HVAC and Industrial Solution"
    />
    <meta
      name="twitter:description"
      content="HIS conçoit, installe et entretient vos systèmes de climatisation, ventilation, désenfumage et protection incendie. Bureau d'études et équipes qualifiées basés à Blida. Devis gratuit."
    />
    <meta name="twitter:image" content="https://www.his-hvac.com/og-image.png" />
    <meta name="twitter:image:alt" content="HIS — HVAC and Industrial Solution, Blida, Algérie" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      Image du hero d'accueil : c'est le plus grand élément affiché (LCP).
      Sans ce préchargement, le navigateur ne la découvre qu'après avoir exécuté
      le JavaScript de la page, ce qui retarde l'affichage d'environ 0,6 s.
    -->
    <link
      rel="preload"
      as="image"
      href="/images/hero-chantier.jpg"
      imagesrcset="/images/hero-chantier-400.webp 400w, /images/hero-chantier-800.webp 800w, /images/hero-chantier-1200.webp 1200w, /images/hero-chantier-1600.webp 1600w, /images/hero-chantier-1920.webp 1920w"
      imagesizes="100vw"
      fetchpriority="high"
      type="image/webp"
    />

    <!-- La carte Google n'est chargée que sur la page Contact : on prépare la connexion sans bloquer le rendu. -->
    <link rel="dns-prefetch" href="https://maps.google.com" />

    <!--
      Photos/vidéos envoyées depuis l'admin (Supabase Storage) : établit la
      connexion HTTPS avant que la première requête d'image ne soit émise.
      %VITE_SUPABASE_URL% est substitué par Vite au build à partir de .env —
      vide (donc sans effet, ni erreur) tant que Supabase n'est pas configuré.
    -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <noscript>
      <div style="padding: 2rem; font-family: system-ui, sans-serif; text-align: center">
        <h1>HIS — HVAC and Industrial Solution</h1>
        <p>
          Ce site nécessite JavaScript. Contactez-nous directement :
          <a href="tel:+213550700036">+213 550 70 00 36</a> —
          <a href="mailto:contact@his-hvac.com?subject=Demande%20de%20devis%20%E2%80%94%20HIS"
            >contact@his-hvac.com</a
          >
        </p>
      </div>
    </noscript>
  </body>
</html>
